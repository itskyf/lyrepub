x-audiocpp-build: &audiocpp-build
  context: .
  dockerfile: containers/Containerfile.audiocpp

services:
  audiocpp:
    build:
      <<: *audiocpp-build
      target: server

    userns_mode: "keep-id:uid=1000,gid=1000"

    devices:
      - nvidia.com/gpu=all

    ports:
      - target: 8080
        published: "8080"
        host_ip: 127.0.0.1
        protocol: tcp

    volumes:
      - type: bind
        source: ./data/models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
          selinux: z

    command: [server, --config, /app/server.json, --host, 0.0.0.0, --backend, cuda]

    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --output, /dev/null, http://127.0.0.1:8080/health]
      start_period: 60s # audio.cpp's readiness helper allows up to 60s for startup.
      start_interval: 1s # audio.cpp's readiness helper polls once per second.

  model-manager:
    build:
      <<: *audiocpp-build
      target: base

    profiles:
      - tools

    userns_mode: "keep-id:uid=1000,gid=1000"

    volumes:
      - type: bind
        source: ./data/models
        target: /app/models
        bind:
          create_host_path: false
          selinux: z

    entrypoint: [/app/entrypoint.sh, model-manager]

  epubcheck:
    build:
      context: https://github.com/w3c/epubcheck.git#a51f751b986ac424488586aae75c43d047bbdc53
      dockerfile: Dockerfile

    profiles:
      - tools

  ace:
    build:
      context: containers
      dockerfile: Containerfile.ace

    profiles:
      - tools

  daisy-pipeline:
    image: docker.io/daisyorg/pipeline:1.15.5

    profiles:
      - tools

    environment:
      PIPELINE2_WS_HOST: 0.0.0.0
      PIPELINE2_WS_AUTHENTICATION: "false"

    ports:
      - target: 8181
        published: "8181"
        host_ip: 127.0.0.1
        protocol: tcp

    healthcheck:
      test: [CMD, bash, -c, "exec 3<>/dev/tcp/127.0.0.1/8181 && printf 'GET /ws/alive HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep --quiet '200 OK' <&3"]
      start_period: 90s # Pipeline's JVM/OSGi startup needs a grace period while frequent startup probes allow prompt readiness detection.
      start_interval: 1s
